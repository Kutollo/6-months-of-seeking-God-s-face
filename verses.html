<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FaithSteps – Daily Verses for August</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
   :root {
    /* August palette — "The Road Home": dusk fading into golden dawn,
       echoing repentance, renewal, and the walk back to the Father's house */
    --bg: linear-gradient(to bottom right, #fbeedc, #f2d5a3);
    --primary: #b5651d;
    --secondary: #8c4a3d;
    --text: #3b2417;
    --white: #fff;
    --shadow: rgba(80,40,10,0.16);
    --highlight: #fbe8c4;
    --highlightFullWeek: #f6d391;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  h1, h2, .display-font { font-family: 'Cormorant Garamond', serif; }

  body {
    font-family: 'DM Sans', sans-serif;
    background:
      linear-gradient(to bottom right, rgba(251,238,220,0.94), rgba(242,213,163,0.94)),
      url('https://images.unsplash.com/photo-1708171448944-077ff4120e1a?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0')
      no-repeat center center/cover;
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    color: var(--text);
  }

   header {
    background:
      linear-gradient(to bottom, rgba(30,15,8,0.45), rgba(60,25,10,0.55)),
      url('https://images.unsplash.com/photo-1708171448944-077ff4120e1a?w=1200&auto=format&fit=crop&q=60&ixlib=rb-4.1.0')
      no-repeat center center/cover;
    color: var(--white);
    text-align: center;
    padding: 5rem 2rem;
  }

  header h1 {
    font-size: 3rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
    letter-spacing: 0.5px;
  }

  header p {
    font-size: 1.2rem;
    font-weight: 500;
    opacity: 0.95;
    text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
  }

  nav {
    background: var(--primary);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    padding: 1rem;
    box-shadow: 0 4px 8px var(--shadow);
  }

  nav a {
    color: var(--white);
    margin: 0.5rem 1.2rem;
    text-decoration: none;
    font-weight: 700;
    font-size: 1.1rem;
    transition: color 0.3s ease;
  }

  nav a:hover {
    color: var(--highlight);
    text-decoration: underline;
  }

  main {
    background: rgba(255, 250, 242, 0.94);
    max-width: 900px;
    margin: 2rem auto;
    padding: 2rem;
    border-radius: 15px;
    box-shadow: 0 8px 25px var(--shadow);
    flex-grow: 1;
  }

  h2 {
    color: var(--primary);
    font-size: 2rem;
    margin-bottom: 1.5rem;
    text-align: center;
    font-weight: 700;
  }

  ul.verse-list {
    list-style: none;
  }

  ul.verse-list li {
    background: var(--highlight);
    margin-bottom: 0.8rem;
    padding: 1rem 1.5rem;
    border-radius: 10px;
    box-shadow: inset 0 0 8px rgba(181,101,29,0.2);
    font-weight: 600;
    font-size: 1.1rem;
    color: var(--primary);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  ul.verse-list li:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 12px var(--shadow);
  }

  ul.verse-list li.past {
    background: #f6e9d2;
    color: #9c8267;
  }

  ul.verse-list li.today {
    background: var(--highlightFullWeek);
    color: var(--secondary);
    font-weight: 700;
    box-shadow: 0 0 12px 2px var(--primary);
  }

  ul.verse-list li.future {
    color: var(--secondary);
  }

  @media (max-width: 600px) {
    header h1 { font-size: 2.2rem; }
    header p { font-size: 1rem; }
    nav a { margin: 0.4rem 0.8rem; font-size: 1rem; }
    main { padding: 1.2rem; }
    ul.verse-list li { font-size: 1rem; padding: 0.8rem 1rem; }
  }
</style>
</head>
<body>
  <header>
    <h1>FaithSteps: Daily Verses for August 2026</h1>
    <p>Walk with God day by day through His Word</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="journal.html">Journal</a>
    <a href="verses.html" aria-current="page">Verses</a>
    <a href="fasting.html">Fasting</a>
  </nav>

  <main>
    <h2>Daily Verses for August</h2>
    <ul class="verse-list" id="verseList"></ul>
  </main>

  <script>
const verses = [
  { day: 1, ref: "Acts 3:19" },
  { day: 2, ref: "Joel 2:13" },
  { day: 3, ref: "Ezekiel 36:26" },
  { day: 4, ref: "Psalm 51:17" },
  { day: 5, ref: "Isaiah 1:18" },
  { day: 6, ref: "Hosea 6:1" },
  { day: 7, ref: "Zechariah 1:3" },
  { day: 8, ref: "Proverbs 28:13" },
  { day: 9, ref: "2 Corinthians 5:17" },
  { day: 10, ref: "Romans 12:2" },
  { day: 11, ref: "Isaiah 43:18-19" },
  { day: 12, ref: "Psalm 139:23-24" },
  { day: 13, ref: "James 4:10" },
  { day: 14, ref: "Luke 15:18" },
  { day: 15, ref: "Micah 6:8" },
  { day: 16, ref: "Philippians 3:13-14" },
  { day: 17, ref: "Psalm 32:5" },
  { day: 18, ref: "Isaiah 30:15" },
  { day: 19, ref: "Jeremiah 3:22" },
  { day: 20, ref: "Acts 26:20" },
  { day: 21, ref: "Ezekiel 18:31" },
  { day: 22, ref: "2 Peter 3:9" },
  { day: 23, ref: "Psalm 23:3" },
  { day: 24, ref: "Malachi 3:7" },
  { day: 25, ref: "Titus 3:5" },
  { day: 26, ref: "Isaiah 55:7" },
  { day: 27, ref: "Psalm 90:14" },
  { day: 28, ref: "Colossians 3:9-10" },
  { day: 29, ref: "Habakkuk 3:2" },
  { day: 30, ref: "Nehemiah 9:17" },
  { day: 31, ref: "2 Chronicles 30:9" }
];
    function buildVerseList() {
      const list = document.getElementById('verseList');
      const today = new Date();
      const currentMonth = today.getMonth();
      const currentDay = today.getDate();
      const isAugust = currentMonth === 7;

      verses.forEach(({day, ref}) => {
        const li = document.createElement('li');
        li.textContent = `August ${day}: ${ref}`;

        if (isAugust) {
          if (day < currentDay) li.classList.add('past');
          else if (day === currentDay) li.classList.add('today');
          else li.classList.add('future');
        } else {
          li.classList.add('future');
        }
        list.appendChild(li);
      });
    }

    window.addEventListener('DOMContentLoaded', buildVerseList);
  </script>
</body>
</html>
