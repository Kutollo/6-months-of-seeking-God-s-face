<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FaithSteps – Daily Verses for October</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:linear-gradient(to bottom right,#f8ead6,#efd3ad);--primary:#a4501f;--secondary:#6b3a4a;--text:#33201a;--white:#fffaf2;--shadow:rgba(60,30,15,.18);--highlight:#f7e3c6;--highlightFullWeek:#e0a458;}
/* October palette — "Come Home": harvest amber and deep plum, a season of returning to God */
*{margin:0;padding:0;box-sizing:border-box}
h1,h2,h3,.display-font{font-family:'Cormorant Garamond',serif}
nav{background:var(--primary);display:flex;flex-wrap:wrap;justify-content:center;padding:1rem;box-shadow:0 4px 8px var(--shadow)}
nav a{color:var(--white);margin:.5rem 1.2rem;text-decoration:none;font-weight:700;font-size:1.1rem}
nav a:hover{color:var(--highlight);text-decoration:underline}
body{font-family:'DM Sans',sans-serif;background:linear-gradient(to bottom right,rgba(248,234,214,.94),rgba(239,211,173,.94)),url('https://images.unsplash.com/photo-1708171448944-077ff4120e1a?w=1200&auto=format&fit=crop&q=60&ixlib=rb-4.1.0') no-repeat center/cover;background-attachment:fixed;min-height:100vh;display:flex;flex-direction:column;color:var(--text)}
header{background:linear-gradient(to bottom,rgba(30,15,8,.45),rgba(60,25,10,.55)),url('https://images.unsplash.com/photo-1708171448944-077ff4120e1a?w=1200&auto=format&fit=crop&q=60&ixlib=rb-4.1.0') no-repeat center/cover;color:var(--white);text-align:center;padding:5rem 2rem}
header h1{font-size:3rem;font-weight:700;margin-bottom:.5rem;text-shadow:2px 2px 6px rgba(0,0,0,.6)}
header p{font-size:1.2rem;font-weight:500;text-shadow:1px 1px 5px rgba(0,0,0,.5)}
main{background:rgba(255,250,242,.94);max-width:900px;margin:2rem auto;padding:2rem;border-radius:15px;box-shadow:0 8px 25px var(--shadow);flex-grow:1}
h2{color:var(--primary);font-size:2rem;margin-bottom:1.5rem;text-align:center}
ul{list-style:none}
li{background:var(--highlight);margin-bottom:.8rem;padding:1rem 1.5rem;border-radius:10px;box-shadow:inset 0 0 8px rgba(164,80,31,.2);font-weight:600;font-size:1.1rem;color:var(--primary);transition:transform .2s,box-shadow .2s}
li:hover{transform:translateY(-2px);box-shadow:0 6px 12px var(--shadow)}
li.past{background:#f3e3cc;color:#9c8267}
li.today{background:var(--highlightFullWeek);color:var(--secondary);font-weight:700;box-shadow:0 0 12px 2px var(--primary)}
li.future{color:var(--secondary)}
@media(max-width:600px){header h1{font-size:2.2rem}header p{font-size:1rem}nav a{margin:.4rem .8rem;font-size:1rem}main{padding:1.2rem}li{font-size:1rem;padding:.8rem 1rem}}
</style>
</head>
<body>
<header><h1>FaithSteps: Daily Verses for October 2026</h1><p>Return to God, day by day, through His Word</p></header>
<nav><a href="index.html">Home</a><a href="journal.html">Journal</a><a href="verses.html" aria-current="page">Verses</a><a href="fasting.html">Fasting</a></nav>
<main><h2>Daily Verses for October</h2><ul id="verseList"></ul></main>
<script>

 }
];
window.addEventListener('DOMContentLoaded',()=>{
  const list=document.getElementById('verseList'),t=new Date(),isOct=t.getMonth()===9,d=t.getDate();
  verses.forEach(({day,ref})=>{
    const li=document.createElement('li');li.textContent=`October ${day}: ${ref}`;
    li.classList.add(isOct?(day<d?'past':day===d?'today':'future'):'future');
    list.appendChild(li);
  });
});
</script>
</body>
</html>
